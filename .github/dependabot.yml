version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - dependencies
    groups:
      nestjs:
        patterns:
          - "@nestjs/*"
      react-ecosystem:
        patterns:
          - react
          - react-dom
          - "@tanstack/*"
          - i18next*
          - react-i18next

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    labels:
      - dependencies
