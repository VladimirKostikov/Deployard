name: Feature request
description: Suggest an improvement or new capability
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Describe the problem first, then the idea. Keep scope realistic for a portfolio control plane.

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is hard or missing today
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What you want to add or change
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you thought about

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Deployments / rollouts
        - Pods / logs / exec
        - Compose import
        - Network / port-forward
        - Auth / RBAC
        - Observability
        - Docs / DX
        - Other
    validations:
      required: true
