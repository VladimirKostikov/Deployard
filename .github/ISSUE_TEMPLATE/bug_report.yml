name: Bug report
description: Something is broken or behaves unexpectedly
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Fill in what you can so we can reproduce it.

  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What went wrong in one or two sentences
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Exact steps from a clean or known state
      placeholder: |
        1. Open ...
        2. Click ...
        3. See error ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true

  - type: dropdown
    id: environment
    attributes:
      label: How do you run Deployard
      options:
        - Docker Compose (make docker-up)
        - Host pnpm dev
        - Helm / cluster install
        - Other
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version
      description: Git tag, commit, or image tag if known
      placeholder: v0.1.0

  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: API logs, browser console, or a screenshot path
